name: Compilar y publicar APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto KEYSTORE_BASE64: el APK se firma con llave debug y no podrá actualizarse."
          fi

      - name: Tests y APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew recordPaparazziDebug assembleRelease
          cp app/build/outputs/apk/release/app-release.apk pendientes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pendientes-apk
          path: pendientes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: app/src/test/snapshots/images/

      # La página de descarga apunta a releases/latest/download/pendientes.apk, que siempre es la última.
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" pendientes.apk \
            --title "Pendientes v0.1.${{ github.run_number }}" \
            --notes "Compilado automáticamente desde ${{ github.sha }}."
